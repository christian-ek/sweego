name: Release

# Publishes to npm via OIDC "trusted publishing" when you publish a GitHub
# Release — no NPM_TOKEN needed (trust is configured on npmjs.com against this
# repo + this workflow file). Provenance is attached automatically.
#
# Flow to cut a release:
#   npm version patch          # bumps package.json, commits, creates vX.Y.Z tag
#   git push --follow-tags
#   gh release create vX.Y.Z --generate-notes

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: package.json

      # Trusted publishing (OIDC) requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install, build, test
        run: |
          npm i
          npm run build
          npm run test
          npm run lint

      - name: Publish (OIDC trusted publishing)
        run: npm publish --access public
